plugins {
    id 'com.android.application'
}

android {
    compileSdk = 36

    defaultConfig {
        applicationId = "com.best.deskclock"
        minSdk = 23
        targetSdk = 36
        versionCode = 2039
        versionName = '2.35'
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    def commitNumber = 0
    def buildCommit = "local"

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            manifestPlaceholders = [appName: "@string/app_label"]
            buildConfigField "boolean", "IS_DEBUG_BUILD", "false"
            buildConfigField "boolean", "IS_NIGHTLY_BUILD", "false"
            buildConfigField "String", "COMMIT_NUMBER", "\"\""
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debugConfig
            manifestPlaceholders = [appName: "@string/app_label_debug"]
            versionNameSuffix = "-debug"
            applicationIdSuffix = ".debug"
            buildConfigField "boolean", "IS_DEBUG_BUILD", "true"
            buildConfigField "boolean", "IS_NIGHTLY_BUILD", "false"
            buildConfigField "String", "COMMIT_NUMBER", "\"\""
        }

        nightly {
            initWith release
            manifestPlaceholders = [appName: "@string/app_label_nightly"]
            versionNameSuffix = "-nightly-${commitNumber}-${buildCommit}"
            applicationIdSuffix = ".nightly"
            signingConfig signingConfigs.debugConfig
            buildConfigField "boolean", "IS_DEBUG_BUILD", "false"
            buildConfigField "boolean", "IS_NIGHTLY_BUILD", "true"
            buildConfigField "String", "COMMIT_NUMBER", "\"${commitNumber}\""
        }
    }

    lintOptions {
        abortOnError = false
    }

    tasks.withType(com.android.build.gradle.internal.tasks.CheckAarMetadataTask).configureEach {
        enabled = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    namespace = 'com.best.deskclock'
}

dependencies {
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-common:1.11.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.github.martin-stone:hsv-alpha-color-picker-android:3.1.0'
}
